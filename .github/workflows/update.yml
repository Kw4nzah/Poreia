# Publishes the JavaScript and asset bundle of every commit on main to GitHub Pages.
# Installed apps download it from there, so most changes need no new APK.
#
# Two jobs on purpose: the one that installs npm packages and runs their code ("build") can only
# read the repository; the one that may write to Pages ("deploy") runs nothing but the official
# deploy action.
name: Publish update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Whatever started this run, only main is ever published. A manual run from another branch
    # (workflow_dispatch lets you pick one) would otherwise ship unreviewed code to every install.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Dependency install scripts do not run; the one patch the project needs is applied by hand.
      - run: npm ci --ignore-scripts
      - run: npx patch-package
      - run: npm test
      - run: npm run typecheck
      - run: npx expo export --platform android --output-dir dist
      - run: node scripts/build-update.mjs dist site
      # Hashes, URLs, runtime version and stray files are checked before anything is uploaded.
      - run: node scripts/verify-update.mjs site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Least privilege: only this job may deploy to Pages, and it runs no project code.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
