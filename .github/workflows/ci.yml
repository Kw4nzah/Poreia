# Type check and unit tests on every push and pull request.
# Independent of "Publish update" (which also runs on pushes to main and deploys);
# this one only checks and never deploys, so the two do not conflict.
name: CI

on:
  push:
    tags-ignore: ['v*'] # "Build APK" already runs the tests on tags
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Dependency install scripts do not run; the one patch the project needs is applied by hand.
      - run: npm ci --ignore-scripts
      - run: npx patch-package
      - run: npx tsc --noEmit
      - run: npm test
