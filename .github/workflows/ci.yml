# Type check and unit tests on every push and pull request.
# Independent of "Publish update" (which also runs on pushes to main and deploys);
# this one only checks and never deploys, so the two do not conflict.
name: CI

on:
  push:
    tags-ignore: ['v*'] # "Build APK" already runs the tests on tags
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
