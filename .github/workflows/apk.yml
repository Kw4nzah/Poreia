# Builds the signed Android APK and attaches it to a GitHub release.
# Needed only when native code changes (new native module, permissions, icon,
# runtimeVersion bump). Everything else ships through "Publish update".
#
# Start it by pushing a tag like v0.1.0.
name: Build APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install

      - name: Build signed release APK (arm64 only, to keep it small)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poreia.p12"
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/poreia.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=poreia \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
          rm "$RUNNER_TEMP/poreia.p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="poreia-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          ls -lh "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Poreia ${GITHUB_REF_NAME}" --generate-notes
