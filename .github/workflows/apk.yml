# Builds the signed Android APK and attaches it to a GitHub release.
# Needed only when native code changes (new native module, permissions, icon,
# runtimeVersion bump). Everything else ships through "Publish update".
#
# Start it by pushing a tag like v0.1.0. The tag must match "version" in app.json and point at a
# commit that is already on main.
name: Build APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  # SHA-256 of the certificate Poreia APKs have been signed with since v0.4.0 (public information).
  # The build stops if the keystore secret holds anything else: Android refuses to update an app
  # with a different signing key, so every installed copy would be locked out of the new APK.
  EXPECTED_CERT_SHA256: ef88664588fb2876f1b558dac28fa2752a08067850b2fc68be337d18e9569375

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Least privilege: only this job may create the release.
    permissions:
      contents: write
    # A named environment lets the repository owner hold the keystore secrets there and require
    # an approval (or limit the tags) before this job can read them. Created on first use.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag is this app version, on main
        run: |
          version="$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; merge it before tagging a release"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      # Dependency install scripts do not run; the one patch the project needs is applied by hand.
      - run: npm ci --ignore-scripts
      - run: npx patch-package
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx expo prebuild --platform android --no-install

      - name: Build signed release APK (arm64 only, to keep it small)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # The signing key lives only in GitHub secrets; never echo it, always delete the file.
          trap 'rm -f "$RUNNER_TEMP/poreia.p12"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/poreia.p12"
          # Before building anything: is this the key the installed apps trust?
          actual="$(keytool -list -v -keystore "$RUNNER_TEMP/poreia.p12" -storetype PKCS12 \
            -storepass:env KEYSTORE_PASSWORD -alias poreia \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d ':' | tr 'A-F' 'a-f')"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::the keystore secret does not hold the expected signing certificate"
            exit 1
          fi
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/poreia.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=poreia \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: The APK is signed with the expected certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          out="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)"
          echo "$out"
          actual="$(printf '%s\n' "$out" | sed -n 's/^\(V[0-9]* \)\{0,1\}Signer\( #1\)\{0,1\}: \{0,1\}certificate SHA-256 digest: //p' | head -n1)"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::the built APK is not signed with the expected certificate"
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="poreia-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          ls -lh "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Poreia ${GITHUB_REF_NAME}" --generate-notes
